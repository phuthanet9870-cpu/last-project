# Production-style stack: PostgreSQL + Redis + game server + worker behind Caddy (automatic HTTPS / WSS).
# Secrets come from .env.production (never committed). NOT verified in the dev container (no Docker daemon there).
# Usage:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: hb, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}", POSTGRES_DB: hearthbound }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U hb -d hearthbound"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
  game:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://hb:${POSTGRES_PASSWORD}@postgres:5432/hearthbound"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      MFA_ENC_KEY: "${MFA_ENC_KEY:?set MFA_ENC_KEY}"
      CORS_ORIGIN: "https://${DOMAIN:?set DOMAIN}"
      TRUST_PROXY: "1"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    expose: ["2567"]
  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    environment: { DATABASE_URL: "postgres://hb:${POSTGRES_PASSWORD}@postgres:5432/hearthbound", REDIS_URL: redis://redis:6379, NODE_ENV: production }
    depends_on: { game: { condition: service_healthy } }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: ["./ops/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [game]
volumes: { pgdata: {}, redisdata: {}, caddy_data: {}, caddy_config: {} }
