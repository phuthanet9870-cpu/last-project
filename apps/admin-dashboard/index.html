<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearthbound Admin</title>
<style>
:root { --bg:#14111c; --panel:#241c2a; --edge:#6a4a30; --text:#f4ead8; --dim:#b8a890; --accent:#ffcf60; --err:#ff7a7a; --ok:#7be07b; color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14111c; } }
:root[data-theme="dark"] { --bg:#14111c; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
header { padding:12px 16px; border-bottom:2px solid var(--edge); display:flex; gap:12px; align-items:center; flex-wrap:wrap; } h1 { font-size:18px; margin:0; color:var(--accent); }
main { padding:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
section { background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:12px; overflow:auto; } h2 { font-size:15px; margin:0 0 8px; color:var(--accent); }
input, select, button { font:inherit; background:#1a1420; color:var(--text); border:1px solid var(--edge); border-radius:6px; padding:5px 8px; margin:2px; } button { cursor:pointer; background:#5a3e2e; }
table { width:100%; border-collapse:collapse; font-size:12px; } td, th { padding:3px 6px; border-bottom:1px solid #ffffff14; text-align:left; } .err { color:var(--err); } .ok { color:var(--ok); } pre { white-space:pre-wrap; font-size:12px; }
</style>
</head>
<body>
<header><h1>Hearthbound — Admin &amp; GM Dashboard</h1><input id="u" placeholder="admin username"><input id="p" type="password" placeholder="password"><button id="login">Login</button><span id="who" class="dim"></span></header>
<main>
<section><h2>Overview</h2><div id="ov">Login with an admin or moderator account.</div><button id="refresh">Refresh</button></section>
<section><h2>Players</h2><input id="q" placeholder="search name"><button id="search">Search</button><div id="players"></div></section>
<section><h2>Sanctions &amp; kick (audited)</h2><input id="sChar" placeholder="character id"><select id="sAct"><option>mute</option><option>suspend</option><option>ban</option><option>unban</option></select><input id="sReason" placeholder="reason (required)"><button id="sGo">Apply</button><button id="kick">Kick</button><div id="sOut"></div></section>
<section><h2>Grant / compensation (audited, admin only)</h2><input id="gChar" placeholder="character id (online)"><input id="gWhat" placeholder="gold | itemId"><input id="gQty" type="number" value="100"><input id="gReason" placeholder="reason (5+ chars)"><button id="gGo">Grant</button><div id="gOut"></div></section>
<section><h2>Announcement</h2><input id="ann" placeholder="message" style="width:70%"><button id="annGo">Broadcast</button></section>
<section><h2>Economy monitor</h2><div id="eco"></div></section>
<section><h2>Feature flags</h2><div id="flags"></div></section>
<section><h2>Reports queue</h2><div id="reports"></div></section>
<section><h2>Audit log</h2><div id="audit"></div></section>
</main>
<script>
let tok = '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function api(path, body) { const r = await fetch('/api' + path, { method: body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + tok }, body: body ? JSON.stringify(body) : undefined }); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; }
const table = (rows) => rows.length ? '<table><tr>' + Object.keys(rows[0]).map((k) => '<th>' + esc(k) + '</th>').join('') + '</tr>' + rows.map((r) => '<tr>' + Object.values(r).map((v) => '<td>' + esc(typeof v === 'object' ? JSON.stringify(v) : v) + '</td>').join('') + '</tr>').join('') + '</table>' : '<i>none</i>';
async function load() {
  try { const o = await api('/admin/overview'); $('ov').innerHTML = `<b>${o.online}</b> online · p95 tick ${o.tickMsP95.toFixed(2)} ms · cmds ${o.cmds} · RSS ${o.memoryMB} MB · listings ${o.listings} · ledger ${o.ledger.ok ? '<span class=ok>balanced</span>' : '<span class=err>PROBLEMS</span>'}<br>DB: ${esc(JSON.stringify(o.db))}` + table(o.worlds); } catch (e) { $('ov').innerHTML = '<span class=err>' + esc(e.message) + '</span>'; return; }
  const e = await api('/admin/economy'); $('eco').innerHTML = table(e.flows) + (e.unbalancedTx.length ? '<p class=err>Unbalanced tx: ' + esc(JSON.stringify(e.unbalancedTx)) + '</p>' : '<p class=ok>All ledger transactions balanced</p>');
  const f = await api('/admin/flags'); $('flags').innerHTML = f.rows.map((r) => `<label><input type=checkbox data-k="${esc(r.key)}" ${r.enabled ? 'checked' : ''}> ${esc(r.key)}</label><br>`).join(''); $('flags').querySelectorAll('input').forEach((i) => i.onchange = () => api('/admin/flags', { key: i.dataset.k, enabled: i.checked }).then(load).catch((er) => { alert(er.message); load(); }));
  $('reports').innerHTML = table((await api('/admin/reports')).rows); $('audit').innerHTML = table((await api('/admin/audit')).rows.map((r) => ({ at: r.at, actor: r.actor, action: r.action, target: r.target, reason: r.reason })));
  const pl = await api('/admin/players?q=' + encodeURIComponent($('q').value)); $('players').innerHTML = '<b>Online</b>' + table(pl.online) + '<b>Search</b>' + table(pl.search);
}
$('login').onclick = async () => { const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: $('u').value, password: $('p').value }) }); const j = await r.json(); if (!r.ok) return alert(j.error); tok = j.accessToken; $('who').textContent = 'role: ' + j.role; load(); };
$('refresh').onclick = load; $('search').onclick = load;
$('sGo').onclick = () => api('/admin/sanction', { charId: $('sChar').value, action: $('sAct').value, reason: $('sReason').value }).then(() => { $('sOut').textContent = 'applied'; load(); }).catch((e) => $('sOut').textContent = e.message);
$('kick').onclick = () => api('/admin/kick', { charId: $('sChar').value, reason: $('sReason').value || 'kicked by GM' }).then((r) => { $('sOut').textContent = r.ok ? 'kicked' : 'not online'; load(); });
$('gGo').onclick = () => { if (!confirm('Grant ' + $('gQty').value + ' × ' + $('gWhat').value + '?')) return; api('/admin/grant', { charId: $('gChar').value, what: $('gWhat').value, qty: Number($('gQty').value), reason: $('gReason').value }).then(() => { $('gOut').textContent = 'granted'; load(); }).catch((e) => $('gOut').textContent = e.message); };
$('annGo').onclick = () => api('/admin/announce', { msg: $('ann').value }).then(() => alert('sent'));
setInterval(() => tok && load().catch(() => {}), 10000);
</script>
</body>
</html>
